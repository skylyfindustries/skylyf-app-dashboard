<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/src/assets/logo.webp" />
    <title>Skylyf Admin</title>
  </head>
  <body>
    <!-- #lens: SVG refraction map used by .card { backdrop-filter: url(#lens) } -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feImage result="map" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cdefs%3E%3ClinearGradient id='r' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23f00'/%3E%3Cstop offset='1' stop-color='%23000'/%3E%3C/linearGradient%3E%3ClinearGradient id='g' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%230f0'/%3E%3Cstop offset='1' stop-color='%23000'/%3E%3C/linearGradient%3E%3Cfilter id='b'%3E%3CfeGaussianBlur stdDeviation='10'/%3E%3C/filter%3E%3C/defs%3E%3Crect width='200' height='200' fill='%23808080'/%3E%3Crect width='200' height='200' fill='url(%23r)'/%3E%3Crect width='200' height='200' fill='url(%23g)' style='mix-blend-mode:screen'/%3E%3Crect x='14' y='14' width='172' height='172' rx='30' fill='%23808080' filter='url(%23b)'/%3E%3C/svg%3E"/>
        <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
        <feDisplacementMap in="blur" in2="map" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
